<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClaimFlow — Submit a Claim</title>
<style>
 :root{--navy:#1F3864;--blue:#2E75B6;--grey:#595959;--line:#D9D9D9}
 *{box-sizing:border-box} body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;
   background:#F7F8FA;color:#111}
 header{background:var(--navy);color:#fff;padding:18px 24px}
 header h1{margin:0;font-size:19px} header span{opacity:.8;font-size:13px}
 main{max-width:820px;margin:24px auto;padding:0 16px}
 .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:22px;margin-bottom:18px}
 label{display:block;font-weight:600;margin:14px 0 5px;font-size:14px}
 input,textarea,select{width:100%;padding:9px 11px;border:1px solid var(--line);
   border-radius:6px;font:inherit}
 button{margin-top:18px;background:var(--blue);color:#fff;border:0;border-radius:6px;
   padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
 button:hover{background:var(--navy)}
 table{width:100%;border-collapse:collapse;font-size:14px}
 th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)}
 th{background:#F2F2F2;font-size:13px}
 .pill{display:inline-block;padding:2px 9px;border-radius:11px;font-size:12px;font-weight:600}
 .AUTO_APPROVED{background:#E2EFDA;color:#375623}
 .PENDING_REVIEW{background:#FBE5D6;color:#833C0C}
 .SUBMITTED{background:#DEEBF7;color:#1F3864}
 .msg{margin-top:14px;padding:11px;border-radius:6px;font-size:14px;display:none}
 .ok{background:#E2EFDA;color:#375623;display:block}
 .err{background:#FBE2E2;color:#843434;display:block}
</style>
</head>
<body>
<header>
  <h1>ClaimFlow</h1>
  <span>Signed in as {{ user.name }} &middot; role: {{ user.role }}</span>
</header>
<main>
  <div class="card">
    <h2 style="margin-top:0">Submit a claim</h2>
    <form id="f">
      <label for="policy_no">Policy number</label>
      <input id="policy_no" required placeholder="POL-MTR-1001">
      <label for="amount">Claim amount (RM)</label>
      <input id="amount" type="number" step="0.01" min="1" required placeholder="1200.00">
      <label for="incident_date">Date of incident</label>
      <input id="incident_date" type="date" required>
      <label for="description">What happened</label>
      <textarea id="description" rows="3" required
        placeholder="Rear bumper damaged in a car park collision."></textarea>
      <button type="submit">Submit claim</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <div class="card">
    <h2 style="margin-top:0">Claims</h2>
    <table id="t">
      <thead><tr><th>Reference</th><th>Policy</th><th>Amount</th>
      <th>Status</th><th>Risk</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</main>

<script>
const msg = document.getElementById('msg');
function show(text, ok){ msg.textContent = text; msg.className = 'msg ' + (ok?'ok':'err'); }

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const body = {
    policy_no:     policy_no.value.trim(),
    amount:        amount.value,
    incident_date: incident_date.value,
    description:   description.value.trim()
  };
  const r = await fetch('/api/claims', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const d = await r.json();
  if (r.ok) { show('Claim ' + d.claim_ref + ' created.', true); e.target.reset(); load(); }
  else      { show(d.error || 'Something went wrong.', false); }
});

async function load(){
  const r = await fetch('/api/claims');
  if (!r.ok) return;
  const d = await r.json();
  document.querySelector('#t tbody').innerHTML = d.claims.map(c => `
    <tr><td>${c.claim_ref}</td><td>${c.policy_no}</td>
    <td>RM ${Number(c.amount).toFixed(2)}</td>
    <td><span class="pill ${c.status}">${c.status.replace('_',' ')}</span></td>
    <td>${c.risk_score ?? '—'}</td></tr>`).join('');
}
load();
</script>
</body>
</html>
